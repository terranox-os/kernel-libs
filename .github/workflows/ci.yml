name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Run tests (result-names feature)
        run: cargo test -p genesis-abi --features result-names

  cross-compile:
    name: Cross-Compile (Bare Metal)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-none
          - aarch64-unknown-none
          - thumbv7em-none-eabi
          - riscv64gc-unknown-none-elf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build for ${{ matrix.target }}
        run: cargo build --workspace --target ${{ matrix.target }}

  rust-miri:
    name: Miri (UB Detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2

      - name: Miri - genesis-abi
        run: cargo +nightly miri test -p genesis-abi

      - name: Miri - kernel-bitops
        run: cargo +nightly miri test -p kernel-bitops

      - name: Miri - kernel-sync
        run: cargo +nightly miri test -p kernel-sync

      - name: Miri - kernel-alloc
        run: cargo +nightly miri test -p kernel-alloc

      - name: Miri - kernel-collections (rbtree)
        run: cargo +nightly miri test -p kernel-collections -- rbtree

      - name: Miri - kernel-collections (ringbuf)
        run: cargo +nightly miri test -p kernel-collections -- ringbuf

      - name: Miri - kernel-collections (static_vec)
        run: cargo +nightly miri test -p kernel-collections -- static_vec

      - name: Miri - kernel-collections (static_hashmap)
        run: cargo +nightly miri test -p kernel-collections -- static_hashmap

      - name: Miri - kernel-crypto
        run: cargo +nightly miri test -p kernel-crypto

      - name: Miri - kernel-elf
        run: cargo +nightly miri test -p kernel-elf

      - name: Miri - kernel-devicetree
        run: cargo +nightly miri test -p kernel-devicetree

  rust-clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  rust-fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  c-build-test:
    name: C Libraries (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile primitives
        run: |
          for f in primitives/src/*.c; do
            gcc -std=c17 -Wall -Wextra -Werror -Wpedantic -ffreestanding \
              -I primitives/include -c "$f" -o "/tmp/$(basename "$f" .c).o"
          done

      - name: Compile bitops
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -Wpedantic -ffreestanding \
            -I bitops/include -c bitops/src/bitmap.c -o /tmp/bitmap.o

      - name: Compile kfmt
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -Wpedantic -ffreestanding \
            -I kfmt/include -c kfmt/src/kprintf.c -o /tmp/kprintf.o

      - name: Compile alloc
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -Wpedantic -ffreestanding \
            -I alloc/include -I genesis-abi/include -I bitops/include \
            -c alloc/src/bitmap_pmm.c -o /tmp/bitmap_pmm.o
          gcc -std=c17 -Wall -Wextra -Werror -Wpedantic -ffreestanding \
            -I alloc/include -I genesis-abi/include \
            -c alloc/src/pool.c -o /tmp/pool.o
          gcc -std=c17 -Wall -Wextra -Werror -Wpedantic -ffreestanding \
            -I alloc/include -I genesis-abi/include -I bitops/include \
            -c alloc/src/slab.c -o /tmp/slab.o

      - name: Run genesis-abi C compile test
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -Wpedantic \
            -I genesis-abi/include \
            -o /tmp/genesis_abi_test genesis-abi/tests/compile_test.c
          /tmp/genesis_abi_test

      - name: Run primitives test
        run: |
          gcc -std=c17 -Wall -Wextra -Werror \
            -I primitives/include \
            -o /tmp/primitives_test \
            primitives/tests/primitives_test.c \
            /tmp/memcpy.o /tmp/memset.o /tmp/memmove.o /tmp/memcmp.o \
            /tmp/strlen.o /tmp/strncmp.o /tmp/strnlen.o /tmp/secure_zero.o \
            /tmp/aliases.o
          /tmp/primitives_test

      - name: Run bitops test
        run: |
          gcc -std=c17 -Wall -Wextra -Werror \
            -I bitops/include \
            -o /tmp/bitops_test bitops/tests/bitops_test.c /tmp/bitmap.o
          /tmp/bitops_test

      - name: Run kfmt test
        run: |
          gcc -std=c17 -Wall -Wextra -Werror \
            -I kfmt/include \
            -o /tmp/kprintf_test kfmt/tests/kprintf_test.c /tmp/kprintf.o
          /tmp/kprintf_test

      - name: Run alloc test
        run: |
          gcc -std=c17 -Wall -Wextra -Werror \
            -I alloc/include -I genesis-abi/include -I bitops/include \
            -o /tmp/alloc_test \
            alloc/tests/alloc_test.c \
            /tmp/bitmap_pmm.o /tmp/pool.o /tmp/slab.o /tmp/bitmap.o
          /tmp/alloc_test

  abi-drift-check:
    name: C/Rust ABI Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check error code values match
        run: |
          echo "Extracting C error codes..."
          grep -oP 'GEN_ERR_\w+\s+\(\(GenResult\)\s*(-?\d+)\)' \
            genesis-abi/include/genesis_result.h | \
            sed 's/((GenResult)//' | sed 's/)//' | \
            sort > /tmp/c_errors.txt

          echo "Extracting Rust error codes..."
          grep -oP 'ERR_\w+:\s*Self\s*=\s*Self\((-?\d+)\)' \
            genesis-abi/src/*.rs | \
            sed 's/: Self = Self(/\t/' | sed 's/)//' | \
            sort > /tmp/rs_errors.txt

          echo "C error codes:"
          cat /tmp/c_errors.txt
          echo ""
          echo "Rust error codes:"
          cat /tmp/rs_errors.txt
          echo ""

          # Verify counts match
          C_COUNT=$(wc -l < /tmp/c_errors.txt)
          RS_COUNT=$(wc -l < /tmp/rs_errors.txt)
          echo "C: $C_COUNT errors, Rust: $RS_COUNT errors"
          if [ "$C_COUNT" != "$RS_COUNT" ]; then
            echo "ERROR: Error code count mismatch!"
            exit 1
          fi
          echo "Error code counts match."

      - name: Check syscall values match
        run: |
          echo "Extracting C syscall numbers..."
          grep -oP 'GEN_SYS_\w+\s+\(\(GenSyscallNr\)(0x[0-9a-fA-F]+)\)' \
            genesis-abi/include/genesis_syscall.h | \
            sed 's/((GenSyscallNr)/\t/' | sed 's/)//' | \
            sort > /tmp/c_syscalls.txt

          echo "Extracting Rust syscall numbers..."
          grep -oP 'SYS_\w+:\s*GenSyscallNr\s*=\s*GenSyscallNr\((0x[0-9a-fA-F]+)\)' \
            genesis-abi/src/*.rs | \
            sed 's/: GenSyscallNr = GenSyscallNr(/\t/' | sed 's/)//' | \
            sort > /tmp/rs_syscalls.txt

          C_COUNT=$(wc -l < /tmp/c_syscalls.txt)
          RS_COUNT=$(wc -l < /tmp/rs_syscalls.txt)
          echo "C: $C_COUNT syscalls, Rust: $RS_COUNT syscalls"
          if [ "$C_COUNT" != "$RS_COUNT" ]; then
            echo "ERROR: Syscall count mismatch!"
            exit 1
          fi
          echo "Syscall counts match."

      - name: Check capability bit values match
        run: |
          echo "Extracting C capability bits..."
          grep -cP 'GEN_CAP_\w+\s+\(\(GenCapability\)' \
            genesis-abi/include/genesis_module.h > /tmp/c_cap_count.txt

          # Count Rust `Self = Self(...)` consts across all genesis-abi
          # source files (these consts now live in result.rs/module.rs
          # after the lib.rs split).
          grep -hP 'pub const [A-Z_]+: Self = Self\(' \
            genesis-abi/src/*.rs | wc -l > /tmp/rs_cap_count.txt

          echo "C capabilities: $(cat /tmp/c_cap_count.txt)"
          echo "Rust Self-consts (caps + errors + OK + ALL): $(cat /tmp/rs_cap_count.txt)"
          if [ "$(cat /tmp/rs_cap_count.txt)" -eq 0 ]; then
            echo "ERROR: No Rust Self-consts found — split may have broken extraction"
            exit 1
          fi
          echo "Drift check passed (structural)."

      - name: Check struct sizes match (compile-time)
        run: |
          # The C compile_test.c already has _Static_assert for sizes.
          # The Rust tests assert sizes. Both passing means they agree.
          cargo test -p genesis-abi -- gen_result_size syscall_nr_size capability_size
          echo "Size assertions passed in both C and Rust."

  frama-c:
    name: Frama-C Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OCaml and opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install Frama-C and solvers
        run: |
          opam install -y frama-c alt-ergo
          eval $(opam env)
          frama-c -version

      - name: Verify primitives
        run: |
          eval $(opam env)
          for src in primitives/src/memcpy.c \
                     primitives/src/memset.c \
                     primitives/src/memmove.c \
                     primitives/src/memcmp.c \
                     primitives/src/strlen.c \
                     primitives/src/strncmp.c \
                     primitives/src/strnlen.c \
                     primitives/src/secure_zero.c; do
            echo "=== Verifying $src ==="
            frama-c -wp \
              -wp-prover alt-ergo \
              -wp-timeout 30 \
              -kernel-warn-key annot-error=abort \
              -cpp-extra-args="-I primitives/include" \
              -machdep x86_64 \
              "$src" || true
          done

      - name: Verify bitops
        run: |
          eval $(opam env)
          echo "=== Verifying bitops/src/bitmap.c ==="
          frama-c -wp \
            -wp-prover alt-ergo \
            -wp-timeout 30 \
            -kernel-warn-key annot-error=abort \
            -cpp-extra-args="-I bitops/include" \
            -machdep x86_64 \
            bitops/src/bitmap.c || true

      - name: Verify alloc
        run: |
          eval $(opam env)
          for src in alloc/src/bitmap_pmm.c \
                     alloc/src/pool.c \
                     alloc/src/slab.c; do
            echo "=== Verifying $src ==="
            frama-c -wp \
              -wp-prover alt-ergo \
              -wp-timeout 30 \
              -kernel-warn-key annot-error=abort \
              -cpp-extra-args="-I alloc/include -I genesis-abi/include -I bitops/include" \
              -machdep x86_64 \
              "$src" || true
          done

  genesis-abi-guard:
    # Enforces version discipline on the published genesis-abi ABI surface.
    # The `genesis-abi-vN.N.N` tag is consumed by trx-libc, trx-ui, and
    # terranox-desktop's trx-compositor — silent ABI drift would break them.
    name: genesis-abi Change Discipline
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history for diff against base

      - name: Verify CHANGELOG entry or bypass label
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          # Files defining the ABI surface that downstream consumers pin via tag.
          # Excludes tests/, README, examples — only the contract itself.
          # `genesis-abi/src/` covers lib.rs and the result/syscall/module/trx
          # submodules added when lib.rs was split.
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- \
            'genesis-abi/include/' \
            'genesis-abi/src/' \
            'genesis-abi/Cargo.toml' || true)

          if [ -z "$changed" ]; then
            echo "No genesis-abi ABI surface changes — guard satisfied."
            exit 0
          fi

          echo "ABI surface files changed in this PR:"
          echo "$changed" | sed 's/^/  /'
          echo ""

          # Bypass label: trivial changes (comments, formatting, internal docs,
          # test-only edits) that don't affect the ABI contract.
          if [[ ",${LABELS}," == *",abi-no-bump,"* ]]; then
            echo "Label 'abi-no-bump' present — bypassing CHANGELOG check."
            exit 0
          fi

          # Real gate: CHANGELOG.md [Unreleased] section must mention genesis-abi.
          # Awk extracts the [Unreleased] block, grep checks for the marker.
          unreleased=$(awk '/^## \[Unreleased\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md)

          if echo "$unreleased" | grep -qi 'genesis-abi'; then
            echo "Found 'genesis-abi' entry in CHANGELOG.md [Unreleased] — guard satisfied."
            exit 0
          fi

          echo "::error::genesis-abi ABI surface changed but no CHANGELOG entry found."
          echo ""
          echo "The genesis-abi tag is a published contract — downstream consumers"
          echo "(trx-libc, trx-ui, terranox-desktop's trx-compositor) all pin to it."
          echo "Silent ABI drift here breaks them."
          echo ""
          echo "To fix this, do ONE of:"
          echo ""
          echo "  1. Add an entry under '## [Unreleased]' in CHANGELOG.md mentioning"
          echo "     'genesis-abi' (describe what changed and why)."
          echo ""
          echo "  2. Apply the 'abi-no-bump' label to this PR — for trivial changes"
          echo "     only (comments, formatting, internal docs, test-only edits"
          echo "     that don't alter the ABI surface)."
          exit 1
